on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Tailscale env
        id: tailenv
        shell: bash
        run: |
          TS_ID=$(echo ${{ secrets.TS_OAUTH_CLIENT_SECRET }} | cut -d '-' -f 3)
          echo ::add-mask::$TS_ID
          echo "TS_ID=$TS_ID" >> "$GITHUB_OUTPUT"
          echo TS_HOST=gha-ssh-${{ runner.os }}-$(openssl rand -hex 6) >> "$GITHUB_OUTPUT"
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ steps.tailenv.outputs.TS_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          hostname: ${{ steps.tailenv.outputs.TS_HOST }}
          tags: tag:weak
      - name: Tailscale SSH set pubkey
        uses: ge9/actions/ssh-pubkey@main
        with:
          ssh_public_key_from_github: ${{github.actor}}
      - name: single-user-sshd
        uses: ge9/single-user-sshd@main
      - name: Diagnose susshd (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($i in 1..3) {
            "--- $(Get-Date -Format o)"
            Get-CimInstance Win32_Process -Filter "Name='sshd.exe'" | Select-Object ProcessId, ParentProcessId, ExecutablePath | Format-Table
            Get-NetTCPConnection -LocalPort 5022 -State Listen -ErrorAction SilentlyContinue | Format-Table
            Start-Sleep 20
          }
          "--- exe exists: $(Test-Path $env:RUNNER_TEMP\susshd\sshd.exe)"
          Get-Content $env:RUNNER_TEMP\susshd\log, $env:RUNNER_TEMP\susshd\err.log
          "--- Defender"
          Get-MpThreatDetection | Format-List
          Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational'; Id=1116,1117} -MaxEvents 10 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message
          "--- Application errors"
          Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001} -MaxEvents 10 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message
      - name: Tailscale SSH info
        uses: ge9/actions/timeout@main
        with:
          check-cmd: ${{ runner.os == 'Windows' && 'powershell -NoProfile -Command "if (-not (Get-NetTCPConnection -State Established -LocalPort 5022 -ErrorAction SilentlyContinue)) { exit 1 }"'
                      || runner.os == 'macOS' && 'netstat -anp tcp | awk ''$6 == "ESTABLISHED" && $4 ~ /\.5022$/ {f=1} END {exit !f}'''
                      || 'ss -Htn state established "( sport = :5022 )" | grep -q .' }}
          info-cmd: "echo ssh -p 5022 ${{ steps.tailenv.outputs.TS_HOST }}"